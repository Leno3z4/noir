<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>DLICOM: ASCEND</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" width="360" height="640" aria-label="DLICOM Ascend game"></canvas>
    <div id="player" aria-hidden="true"><i></i><i></i><b></b></div>
    <div id="hud">
      <div><span>HEIGHT</span><b id="height">0</b></div>
      <div><span>BEST</span><b id="best">0</b></div>
      <div><span>SPEED</span><b id="speed">1.00x</b></div>
    </div>
    <section id="menu" class="overlay">
      <div class="card">
        <div class="eyebrow">DLICOM GAME JAM</div>
        <h1>DLICOM:<br><em>ASCEND</em></h1>
        <p>The mascot keeps bouncing. Steer. Wrap. Climb. Don't fall.</p>
        <button id="start">START RUN</button>
        <div class="controls">A / D · ← / → · touch left/right side</div>
      </div>
    </section>
    <section id="game-over" class="overlay hidden">
      <div class="card">
        <div class="eyebrow">RUN ENDED</div>
        <h2 id="final-height">0m</h2>
        <p id="new-best" class="hidden">NEW BEST</p>
        <button id="restart">RUN IT BACK</button>
        <div class="seed" id="seed"></div>
      </div>
    </section>
    <div id="touch-left" class="touch-zone"></div>
    <div id="touch-right" class="touch-zone"></div>
  </main>
  <script type="module" src="src/game.js"></script>
</body>
</html>
